name: AI Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What app do you want?'
        required: true
      repo_name:
        description: 'New repo name'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install openai pygithub
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USER_PROMPT: ${{ inputs.prompt }}
          USER_REPO: ${{ inputs.repo_name }}
        run: python build.py
